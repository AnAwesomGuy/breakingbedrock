plugins {
    id "com.gradleup.shadow"
}

architectury {
    platformSetupLoomIde()
    forge()
}

loom {
    forge {
        mixinConfig "${mod_id}.mixins.json"
    }
}

configurations {
    common {
        canBeResolved = true
        canBeConsumed = false
    }
    shadowCommon {
        canBeResolved = true
        canBeConsumed = false
    }
    compileClasspath.extendsFrom common
    runtimeClasspath.extendsFrom common
    developmentForge.extendsFrom common
}

dependencies {
    forge "net.minecraftforge:forge:$minecraft_version-$forge_version"

    common(project(path: ":common", configuration: "namedElements")) { transitive false }
    shadowCommon(project(path: ":common", configuration: "transformProductionForge"))
}

processResources {
    exclude "META-INF/neoforge.mods.toml"
}

shadowJar {
    configurations = [project.configurations.shadowCommon]
    archiveClassifier = "dev-shadow"
    destinationDirectory.set destinationDirectory.dir('../devlibs').get()
    exclude "architectury_inject*/**"
}

import com.github.jengelman.gradle.plugins.shadow.tasks.ShadowJar

build.dependsOn tasks.register("neoforgeJar", ShadowJar) {
    dependsOn jar

    from(sourceSets.main.output) { exclude "META-INF/mods.toml", "*-refmap.json" }
    from(sourceSets.main.resources.matching(new PatternSet().include("META-INF/neoforge.mods.toml")).singleFile) {
        rename { "META-INF/mods.toml" }
        filter { it.empty ? null : it }

        def props = rootProject.modProperties()
        inputs.properties props
        expand props
    }

    configurations = [project.configurations.shadowCommon]
    archiveAppendix = "neoforge"
    archiveVersion = project.mod_version + "+1.20.4"
    relocate('net.minecraftforge', 'net.neoforged') {
        skipStringConstants = true
    }
}

remapJar {
    inputFile.set shadowJar.archiveFile
    dependsOn shadowJar
}

tasks.withType(JavaCompile).configureEach {
    options.release = 17 // we only support 1.18+ (which uses Java 17) on forge
}

